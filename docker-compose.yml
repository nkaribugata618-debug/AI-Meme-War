version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: meme_war_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d meme_war_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://admin:password@db:5432/meme_war_db?schema=public"
      JWT_SECRET: "development-secret-do-not-use-in-production"
      # IMPORTANT: Override this in your real deployment or local .env
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}" 
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push && node server.js"

volumes:
  pgdata:
